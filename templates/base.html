
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Biblioteca Escolar{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- NOME DA BIBLIOTECA -->
            <a class="navbar-brand" href="{% url 'home' %}">
                Biblioteca Django
            </a>

            <!-- BOTÃO PARA MENU EM CELULARES -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuBiblioteca"
                aria-controls="menuBiblioteca"
                aria-expanded="false"
                aria-label="Abrir menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- SERVIÇOS -->
            <div class="collapse navbar-collapse" id="menuBiblioteca">

                {% if request.session.matricula %}

                    <ul class="navbar-nav ms-auto align-items-lg-center">

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'agendar' %}">
                                Agendar Horários
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'favoritos' %}">
                                Favoritos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'perfil' %}">
                                Perfil
                            </a>
                        </li>

                        <li class="nav-item ms-lg-3">
                            <a
                                href="{% url 'logout' %}"
                                class="btn btn-outline-light btn-sm"
                            >
                                Sair
                            </a>
                        </li>

                    </ul>

                {% endif %}

            </div>

        </div>

    </nav>


    <!-- MENSAGENS DO SISTEMA -->
    <div class="container mt-4">

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <!-- CONTEÚDO DAS PÁGINAS -->
        {% block content %}

        {% endblock %}

    </div>


    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
